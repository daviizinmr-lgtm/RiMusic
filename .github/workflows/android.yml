name: Compilar PacocaMusic APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PacocaMusic APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: gradle

      - name: Permissao de execucao para gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Full Debug)
        run: ./gradlew assembleFullDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: PacocaMusic-APK
          path: composeApp/build/outputs/apk/**/*.apk
          retention-days: 30
